<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a14"/>
      <stop offset="100%" style="stop-color:#0a0f0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2bc4a8"/>
      <stop offset="100%" style="stop-color:#1a9a7f"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Rocket body -->
  <path d="M256 96c-40 60-64 130-64 200h128c0-70-24-140-64-200z" fill="url(#accent)" opacity="0.95"/>
  <!-- Rocket nose -->
  <ellipse cx="256" cy="96" rx="24" ry="32" fill="#2bc4a8"/>
  <!-- Window -->
  <circle cx="256" cy="210" r="28" fill="#0f1a14"/>
  <circle cx="256" cy="210" r="18" fill="#1a3a2a" opacity="0.8"/>
  <!-- Flames -->
  <path d="M220 296q36 80 36 120q0-40 36-120z" fill="#f59e0b" opacity="0.9"/>
  <path d="M232 296q24 60 24 96q0-36 24-96z" fill="#fbbf24"/>
  <!-- Zen circle (enso) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#2bc4a8" stroke-width="6" stroke-dasharray="900 110" opacity="0.3"/>
</svg>
